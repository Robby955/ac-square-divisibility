name: Verify proof and certificates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: lean
          auto-config: "false"
          build: "true"
          use-mathlib-cache: "true"
      - name: Check source hashes, tests and Lean dependencies
        run: python3 verify.py --lean
      - name: Replay all constructed certificates
        run: python3 experiment.py --matrix --output run/replay.json
      - name: Check manuscript identities on signed inputs
        run: python3 paper/check_exposition.py
      - name: Check that the paper table regenerates exactly
        run: |
          python3 paper/generate_table.py
          git diff --exit-code -- paper/entry-table.tex

      - name: Check height-five and two-factor additions
        run: |
          python3 generate_release_lean.py --check
          python3 release_additions.py --matrix --output run/additions.json
          python3 verify_additions.py run/additions.json
